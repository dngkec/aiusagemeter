name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS disk image
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the app bundle
        run: ./scripts/build-app.sh

      - name: Package the disk image
        run: ./scripts/make-dmg.sh --no-build

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 *.dmg | tee SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Configuration Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package self-contained application
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $version = if ($ref.StartsWith("v")) { $ref.Substring(1) } else { "1.1.0" }
          ./scripts/package-windows.ps1 -Runtime ${{ matrix.runtime }} -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: |
            dist/*-${{ matrix.runtime }}-setup.exe
            dist/SHA256SUMS-windows-${{ matrix.runtime }}.txt

  release:
    name: Publish release assets
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/SHA256SUMS-*.txt
          # Notes for the release itself are written by hand after the build. This body is
          # only the standing install note, so a rebuild of an existing tag does not
          # overwrite the changelog with boilerplate.
          generate_release_notes: true
          body: |
            macOS: the app is ad-hoc signed rather than notarised, so the first launch
            needs Finder: right-click **AIUsageMeter.app**, choose **Open**, and confirm.
            Windows: run the installer matching your CPU. It installs for the current
            user and needs no administrator rights. Both builds are unsigned.

            If you find AIUsageMeter useful, you can
            [buy me a coffee](https://buymeacoffee.com/dngkec).
            Interface design by [@hivinz_](https://x.com/hivinz_).
