name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      # The test suite is not published, so there is no `swift test` step here.
      # `Package.swift` declares the test target only when `Tests/` is present.
      - name: Build
        run: swift build -c release

      - name: Build the app bundle
        run: ./scripts/build-app.sh

      # Finder automation is not available to a CI runner, so the image comes
      # out correct but unarranged. That is expected and is not a failure.
      - name: Package the disk image
        run: ./scripts/make-dmg.sh --no-build

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: AIUsageMeter-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows build, test, and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AIUsageMeter.Windows.sln

      # Both suites: the portable logic and the WPF layer, which holds the settings view model,
      # its hand-drawn controls, and the window's own bindings. The WPF suite was previously
      # compiled by nobody and run by nobody.
      #
      # The script launches the Microsoft.Testing.Platform executables rather than going through
      # `dotnet test`, whose .NET 10 SDK server mode reports "Zero tests ran" on some machines and
      # would turn a red suite into a silent green tick.
      - name: Test
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Configuration Release

      - name: Build WPF application
        run: dotnet build src/AIUsageMeter.Windows/AIUsageMeter.Windows.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Package self-contained application
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Runtime win-x64

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AIUsageMeter-windows
          path: |
            dist/*-win-x64.zip
            dist/SHA256SUMS-windows-win-x64.txt
          if-no-files-found: error
